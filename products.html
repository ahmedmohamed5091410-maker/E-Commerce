<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | Luxe Premium E-Commerce</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">
  <style>
    .shop-header {
      background: var(--surface-color);
      padding: var(--spacing-xl) 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: var(--spacing-xl);
    }
    .filters-bar {
      display: flex;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-xl);
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      background: var(--surface-color);
      padding: var(--spacing-md);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }
    .filter-group {
      display: flex;
      gap: var(--spacing-sm);
      align-items: center;
    }
    .search-input {
      min-width: 250px;
    }
  </style>
</head>
<body>
  
  <!-- Header (Same as index.html) -->
  <header class="header">
    <div class="container flex-between navbar">
      <a href="index.html" class="logo">
        <h2>Luxe.</h2>
      </a>
      
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="products.html" class="active">Shop</a>
        <a href="index.html#categories">Categories</a>
        <a href="#footer">About</a>
      </nav>

      <div class="nav-actions">
        <button id="theme-toggle" class="icon-btn">🌙</button>
        <a href="wishlist.html" class="icon-btn">❤️<span id="wishlist-badge" class="badge" style="display: none;">0</span></a>
        <a href="cart.html" class="icon-btn">🛒<span id="cart-badge" class="badge" style="display: none;">0</span></a>
        <a href="login.html" id="user-icon" class="icon-btn">👤</a>
        
        <button class="mobile-menu-btn">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Shop Page Content -->
  <div class="shop-header">
    <div class="container">
      <h1>All Products</h1>
      <p>Discover our complete collection of premium items.</p>
    </div>
  </div>

  <main class="container">
    <div class="filters-bar animate-slide-up">
      <div class="filter-group">
        <input type="text" id="search-input" class="form-control search-input" placeholder="Search products...">
      </div>
      
      <div class="filter-group" style="flex-wrap: wrap;">
        <select id="category-filter" class="form-control" style="width: auto;">
          <option value="all">All Categories</option>
          <!-- Options populated by JS -->
        </select>
        
        <select id="sort-filter" class="form-control" style="width: auto;">
          <option value="default">Sort By: Recommended</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name-asc">Name: A to Z</option>
          <option value="name-desc">Name: Z to A</option>
          <option value="rating">Highest Rated</option>
        </select>
      </div>
    </div>

    <div id="products-grid" class="grid products-grid" style="grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); margin-bottom: 4rem;">
      <!-- Products loaded via JS -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 Luxe E-Commerce. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <button id="back-to-top" class="back-to-top">↑</button>

  <script type="module" src="app.js"></script>
  <script type="module" src="products.js"></script>
</body>
</html>
