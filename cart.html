<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | Luxe</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">
  <style>
    .cart-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: var(--spacing-xl);
      margin: var(--spacing-xl) 0 4rem;
    }
    .order-summary {
      background: var(--surface-color);
      padding: var(--spacing-xl);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      height: fit-content;
      position: sticky;
      top: 100px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: var(--spacing-md);
      color: var(--text-secondary);
    }
    .summary-row.total {
      color: var(--text-primary);
      font-weight: 700;
      font-size: 1.25rem;
      border-top: 1px solid var(--border-color);
      padding-top: var(--spacing-md);
      margin-top: var(--spacing-md);
    }
  </style>
</head>
<body>
  
  <header class="header">
    <div class="container flex-between navbar">
      <a href="index.html" class="logo"><h2>Luxe.</h2></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
      </nav>
      <div class="nav-actions">
        <button id="theme-toggle" class="icon-btn">🌙</button>
        <a href="wishlist.html" class="icon-btn">❤️<span id="wishlist-badge" class="badge" style="display: none;">0</span></a>
        <a href="cart.html" class="icon-btn" style="color: var(--accent-color);">🛒<span id="cart-badge" class="badge" style="display: none;">0</span></a>
        <a href="login.html" id="user-icon" class="icon-btn">👤</a>
      </div>
    </div>
  </header>

  <main class="container">
    <h1 style="margin-top: 2rem;">Shopping Cart</h1>
    
    <div class="cart-layout animate-slide-up">
      <!-- Cart Items -->
      <div>
        <div id="empty-cart-msg" style="display: none; text-align: center; padding: 4rem 0;">
          <span style="font-size: 4rem;">🛒</span>
          <h2>Your cart is empty</h2>
          <p style="margin-bottom: 2rem;">Looks like you haven't added anything yet.</p>
          <a href="products.html" class="btn btn-primary">Start Shopping</a>
        </div>
        <div id="cart-items-container">
          <!-- Items injected by JS -->
        </div>
      </div>

      <!-- Order Summary -->
      <div class="order-summary">
        <h3>Order Summary</h3>
        <div style="margin-top: 1.5rem;">
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="cart-subtotal">$0.00</span>
          </div>
          <div class="summary-row">
            <span>Tax (10%)</span>
            <span id="cart-tax">$0.00</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span style="color: var(--success-color);">Free</span>
          </div>
          
          <!-- Coupon -->
          <div style="display: flex; gap: 0.5rem; margin: 1.5rem 0;">
            <input type="text" class="form-control" placeholder="Promo code">
            <button class="btn btn-outline">Apply</button>
          </div>

          <div class="summary-row total">
            <span>Total</span>
            <span id="cart-total">$0.00</span>
          </div>

          <a href="checkout.html" id="checkout-btn" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">Proceed to Checkout</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container"><div class="footer-bottom"><p>&copy; 2026 Luxe E-Commerce. All rights reserved.</p></div></div>
  </footer>

  <script type="module" src="app.js"></script>
  <script type="module" src="cart-ui.js"></script>
</body>
</html>
