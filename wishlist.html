<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist | Luxe</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">
</head>
<body>
  
  <header class="header">
    <div class="container flex-between navbar">
      <a href="index.html" class="logo"><h2>Luxe.</h2></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
      </nav>
      <div class="nav-actions">
        <button id="theme-toggle" class="icon-btn">🌙</button>
        <a href="wishlist.html" class="icon-btn" style="color: var(--error-color);">❤️<span id="wishlist-badge" class="badge" style="display: none;">0</span></a>
        <a href="cart.html" class="icon-btn">🛒<span id="cart-badge" class="badge" style="display: none;">0</span></a>
        <a href="login.html" id="user-icon" class="icon-btn">👤</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div style="text-align: center; margin: 3rem 0;">
      <h1>My Wishlist</h1>
      <p>Save your favorite items here.</p>
    </div>
    
    <div id="empty-wishlist-msg" style="display: none; text-align: center; padding: 4rem 0;">
      <span style="font-size: 4rem;">🤍</span>
      <h2>Your wishlist is empty</h2>
      <p style="margin-bottom: 2rem;">Discover something you love and add it to your wishlist.</p>
      <a href="products.html" class="btn btn-primary">Discover Products</a>
    </div>

    <div id="wishlist-container" class="grid products-grid" style="grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); margin-bottom: 4rem;">
      <!-- Items injected by JS -->
    </div>
  </main>

  <footer class="footer">
    <div class="container"><div class="footer-bottom"><p>&copy; 2026 Luxe E-Commerce. All rights reserved.</p></div></div>
  </footer>

  <script type="module" src="app.js"></script>
  <script type="module" src="wishlist-ui.js"></script>
</body>
</html>
