<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Luxe</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">
  <style>
    .checkout-layout {
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: var(--spacing-xxl);
      margin: var(--spacing-xl) 0 4rem;
    }
    .checkout-section {
      background: var(--surface-color);
      padding: var(--spacing-xl);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      margin-bottom: var(--spacing-lg);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-md);
    }
  </style>
</head>
<body>
  
  <header class="header">
    <div class="container flex-between navbar">
      <a href="index.html" class="logo"><h2>Luxe.</h2></a>
      <a href="cart.html" style="color: var(--text-secondary); display: flex; align-items: center; gap: 0.5rem;">
        <span>←</span> Back to Cart
      </a>
    </div>
  </header>

  <main class="container">
    <h1 style="margin-top: 2rem;">Checkout</h1>
    
    <div class="checkout-layout">
      
      <form id="checkout-form">
        <div class="checkout-section animate-slide-up">
          <h3 style="margin-bottom: 1.5rem;">Contact Information</h3>
          <div class="form-group">
            <label class="form-label">Email address</label>
            <input type="email" id="email" class="form-control" required>
          </div>
        </div>

        <div class="checkout-section animate-slide-up" style="animation-delay: 0.1s;">
          <h3 style="margin-bottom: 1.5rem;">Shipping Address</h3>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">First Name</label>
              <input type="text" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">Last Name</label>
              <input type="text" class="form-control" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Address</label>
            <input type="text" class="form-control" required placeholder="Street address or P.O. Box">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">City</label>
              <input type="text" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">Postal Code</label>
              <input type="text" class="form-control" required>
            </div>
          </div>
        </div>

        <div class="checkout-section animate-slide-up" style="animation-delay: 0.2s;">
          <h3 style="margin-bottom: 1.5rem;">Payment Method</h3>
          
          <div style="border: 1px solid var(--accent-color); border-radius: var(--radius-md); padding: 1rem; margin-bottom: 1rem; background: rgba(59, 130, 246, 0.05);">
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-weight: 500;">
              <input type="radio" name="payment" checked>
              Credit Card
            </label>
          </div>

          <div class="form-group" style="margin-top: 1rem;">
            <label class="form-label">Card Number</label>
            <input type="text" class="form-control" placeholder="0000 0000 0000 0000" required minlength="16" maxlength="19">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Expiration Date</label>
              <input type="text" class="form-control" placeholder="MM/YY" required>
            </div>
            <div class="form-group">
              <label class="form-label">CVC</label>
              <input type="text" class="form-control" placeholder="123" required minlength="3" maxlength="4">
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1.25rem; font-size: 1.1rem; margin-bottom: 2rem;">Pay Now</button>
      </form>

      <!-- Order Summary -->
      <div>
        <div class="checkout-section sticky" style="top: 100px;">
          <h3 style="margin-bottom: 1.5rem;">Order Summary</h3>
          <div id="checkout-summary">
            <!-- Injected by JS -->
          </div>
        </div>
      </div>
      
    </div>
  </main>

  <script type="module" src="app.js"></script>
  <script type="module" src="checkout.js"></script>
</body>
</html>
